# Robolectric configuration
# Enable better font rendering
sdk=33
qualifiers=w1920dp-h720dp-land-mdpi

# Graphics mode - native for hardware acceleration simulation
graphics_mode=native

# Enable more accurate rendering
# https://robolectric.org/configuring/
render_scripts_automatically=false
# Use relaxed accessibility checks (reduces rendering overhead)
relax_automator=true

# Font rendering - try to match hardware better
# These are experimental/system properties
# Note: Robolectric uses JVM font rendering, not native Android rendering
